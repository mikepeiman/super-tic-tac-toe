<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Apply a stored theme override before first paint (see Preferences).
			try {
				document.querySelector('meta[name="color-scheme"]').content =
					localStorage.getItem('sttt:color-scheme') ?? 'light dark';
			} catch {}
		</script>
		<meta name="description" content="Tic-tac-toe grown into a strategy game for 2–8 players." />
		<meta name="theme-color" content="#16171d" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
